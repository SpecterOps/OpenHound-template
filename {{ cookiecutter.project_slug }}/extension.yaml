name: "{{ cookiecutter.target_service_slug }}"
version: 0.0.1
description: "OpenHound collector for {{ cookiecutter.target_service_slug }}"
authors:
  - name: "{{ cookiecutter.author }}"
    email: "{{ cookiecutter.author_email }}"

type: local
license: MIT
homepage: TBD
references:
  - name: OpenHound
    url: TBD

credentials:
  - name: api_url
    description: API base URL, shared by both authentication modes.
    required: false
    default: https://api.example.com
  - name: token
    description: API bearer token. Supply this for token authentication instead of username and password.
    required: false
  - name: username
    description: API username. Required with password for basic authentication.
    required: false
  - name: password
    description: API password. Required with username for basic authentication.
    required: false

parameters:
  - name: collection
    description: Resource group (all, directory, inventory). Inventory includes groups needed by membership edges.
    required: false
    default: all

tags: ["{{ cookiecutter.target_service_slug }}", "extension", "opengraph", "bloodhound"]
