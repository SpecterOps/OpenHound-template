[project]
name = "{{ cookiecutter.project_slug}}"
version = "0.0.1"
description = "OpenGraph collector for {{ cookiecutter.target_service_slug}} using OpenHound"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = ["openhound>=0.5.1"]
authors = [
{% if cookiecutter.author or cookiecutter.author_email %}
  {name = "{{ cookiecutter.author}}", email = "{{ cookiecutter.author_email }}"}
{% endif %}
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ["src/openhound_{{ cookiecutter.target_service_slug }}"]

[tool.hatch.build.targets.wheel.force-include]
"extension.yaml" = "openhound_{{ cookiecutter.target_service_slug}}/extension.yaml"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.1",
    "requests-mock>=1.12.1",
    "fastapi>=0.115",
    "httpx>=0.28",
    "ruff>=0.15.5",
    "mypy>=1.19.1",
    "griffe>=1.15.0",
]

[project.entry-points."openhound.sources"]
{{ cookiecutter.target_service_slug}} = "openhound_{{ cookiecutter.target_service_slug}}.main:app"

[tool.mypy]
python_version = "3.13"
files = ["src"]
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["openhound.*"]
follow_untyped_imports = true
