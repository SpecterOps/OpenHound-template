[project]
name = "{{ cookiecutter.project_slug}}"
version = "0.0.1"
description = "OpenGraph collector for {{ cookiecutter.target_service_slug}} using OpenHound"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  {name = "{{ cookiecutter.author}}", email = "{{ cookiecutter.author_email }}"}
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel.force-include]
"extension.yaml" = "openhound_{{ cookiecutter.target_service_slug}}/extension.yaml"

[dependency-groups]
dev = [
    "openhound @ git+https://github.com/SpecterOps/openhound.git",
    "pre-commit>=4.5.1",
    "pytest>=9.0.1",
    "ruff>=0.15.5",
    "mypy>=1.19.1",
    "zensical>=0.0.27",
]

[project.entry-points."openhound.sources"]
{{ cookiecutter.target_service_slug}} = "openhound_{{ cookiecutter.target_service_slug}}.main:app"
