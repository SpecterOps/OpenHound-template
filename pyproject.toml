[project]
name = "openhound-template"
version = "0.0.1"
description = "OpenGraph collector template using OpenHound"
readme = "README.md"
requires-python = ">=3.13"


[dependency-groups]
dev = [
    "openhound>=0.5.1",
    "cookiecutter>=2.6",
    "build>=1.2",
    "hatchling>=1.27",
    "requests-mock>=1.12.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.1",
    "ruff>=0.15.5",
    "mypy>=1.19.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
